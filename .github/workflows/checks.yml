name: Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Renders every page at 360/768/1024/1366px in light and dark and fails on layout defects.
      # Uses the Google Chrome preinstalled on GitHub's Ubuntu runners.
      - run: npm run check:layout
      - run: npm run check:seo
      - run: npm run check:ai
